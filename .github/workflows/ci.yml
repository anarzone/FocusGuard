name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:    # so release.yml can run the same build+test as a prereq

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Override signing for CI runners — the GitHub-hosted runner has no
      # access to the Personal Team cert that's pinned in project.yml. Ad-hoc
      # signing produces a runnable binary for tests without needing certs.
      - name: Build (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project FocusGuard.xcodeproj \
            -scheme FocusGuard \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build | xcbeautify --renderer github-actions || xcodebuild \
            -project FocusGuard.xcodeproj \
            -scheme FocusGuard \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      # German and Azerbaijani must be complete, including strings the build
      # just found in the code.
      - name: Check translations
        run: python3 scripts/check-translations.py --built

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project FocusGuard.xcodeproj \
            -scheme FocusGuard \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7

  # The browser extension's own logic (extension/chrome): plain Node tests,
  # no dependencies to install.
  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: extension/chrome
        run: npm test

  # Real mouse clicks on the window (FocusGuardUITests): catches anything
  # lying over a control, which unit tests and accessibility presses miss.
  # The app runs in UITestMode, an in-memory store with sample data.
  click-tests:
    name: Click tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Allow UI automation without a password
        run: sudo automationmodetool enable-automationmode-without-authentication || true

      - name: Run click tests
        run: |
          set -o pipefail
          xcodebuild \
            -project FocusGuard.xcodeproj \
            -scheme FocusGuardUITests \
            -destination 'platform=macOS' \
            -resultBundlePath click-tests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            test

      - name: Upload results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click-test-results
          path: click-tests.xcresult
          retention-days: 7
