name: Release

# Cuts a fully signed release. Mirrors what scripts/release.sh does locally,
# minus the tap-clone step (we use gh + a PAT instead of the user's git creds).
#
# Triggered by:
#   • Pushing to main with changes under app code paths — auto-bumps the patch
#     version, tags the commit, runs the full release flow.
#   • Manual dispatch with an optional version override (otherwise auto-bumps).
#
# Skip a release entirely by including [skip ci] in the commit message —
# that's GitHub's built-in opt-out and works for every workflow in this repo.
#
# Required GitHub secrets:
#   MACOS_CERT_P12             base64 of an Apple Development .p12 export
#   MACOS_CERT_P12_PASSWORD    password set when exporting the .p12
#   KEYCHAIN_PASSWORD          arbitrary; protects the temp build keychain
#   TAP_PUSH_TOKEN             fine-grained PAT with write access to anarzone/homebrew-tap
#   APPLE_TEAM_ID              Apple Developer team id
#   APPLE_SIGN_IDENTITY        cert SHA-1 hash, e.g. AB2E6306E4204F28FF692A59F7DD1E639E99B947

on:
  push:
    branches: [main]
    paths:
      - 'FocusGuard/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (without v-prefix). Leave blank to auto-bump patch.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: CI prereq (build + test)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign, release, bump tap
    needs: test       # don't ship if tests are red
    runs-on: macos-15
    permissions:
      contents: write   # for tag push + gh release create

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to find the latest tag

      - name: Resolve version (auto-bump unless overridden)
        id: ver
        run: |
          set -euo pipefail
          OVERRIDE="${{ inputs.version }}"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          else
            # Latest v* tag (or v0.0.0 on a fresh repo).
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            LATEST="${LATEST:-v0.0.0}"
            CURRENT="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          TAG="v$VERSION"
          # Defensive: refuse to clobber a tag that already exists.
          if git rev-parse --verify --quiet "$TAG" >/dev/null; then
            echo "Tag $TAG already exists — pick a different version override." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "==> Releasing $TAG"

      - name: Tag commit
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing cert into temp keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$MACOS_CERT_P12" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          set -o pipefail
          rm -rf build/release
          xcodebuild \
            -project FocusGuard.xcodeproj \
            -scheme FocusGuard \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/release \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$APPLE_SIGN_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            build

      - name: Bundle authoritative icns + re-sign
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          APP="build/release/Build/Products/Release/FocusGuard.app"
          [ -d "$APP" ] || { echo "Build did not produce $APP" >&2; exit 1; }

          if [ -f "FocusGuard/Resources/AppIcon.icns" ]; then
            cp "FocusGuard/Resources/AppIcon.icns" "$APP/Contents/Resources/AppIcon.icns"
          fi

          codesign --force --sign "$APPLE_SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --options runtime \
            --entitlements FocusGuard/Resources/FocusGuard.entitlements \
            "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip + sha256
        id: zip
        run: |
          mkdir -p build
          ZIP="build/FocusGuard-${{ steps.ver.outputs.tag }}.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "build/release/Build/Products/Release/FocusGuard.app" "$ZIP"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "==> $ZIP ($SHA)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" "${{ steps.zip.outputs.zip_path }}" \
            --title "$TAG" \
            --notes "FocusGuard $TAG

          \`\`\`sh
          brew upgrade --cask anarzone/tap/focusguard
          \`\`\`

          (or first-time: \`brew install --cask anarzone/tap/focusguard\`)"

      - name: Bump homebrew-tap
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/anarzone/homebrew-tap.git" "$TAP_DIR"

          CASK="$TAP_DIR/Casks/focusguard.rb"
          sed -i '' "s|version \".*\"|version \"${{ steps.ver.outputs.version }}\"|" "$CASK"
          sed -i '' "s|sha256 \".*\"|sha256 \"${{ steps.zip.outputs.sha256 }}\"|" "$CASK"

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/focusguard.rb
          git commit -m "focusguard: bump to ${{ steps.ver.outputs.version }}"
          git push origin main

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
