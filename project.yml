name: FocusGuard
options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "JVK43S5CGA"     # Anar Haqverdiyev Personal Team
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES       # required for notarization
    CODE_SIGN_ENTITLEMENTS: FocusGuard/Resources/FocusGuard.entitlements
    SWIFT_STRICT_CONCURRENCY: minimal  # tighten to 'complete' once codebase is stable

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  FocusGuard:
    type: application
    platform: macOS
    sources:
      - path: FocusGuard
      - path: FocusGuardShared
    dependencies:
      - package: Sparkle
      # Desktop widgets and the Control Center control (PlugIns/).
      - target: FocusGuardWidgets
    info:
      path: FocusGuard/Resources/Info.plist
      properties:
        CFBundleName: FocusGuard
        # Spotify developer app for search (PKCE, no secret). Development mode:
        # only accounts added in the Spotify dashboard can sign in.
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        CFBundleDisplayName: FocusGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true                # menu bar app, no Dock icon
        # AppIcon.icon (Icon Composer): Assets.car for macOS 26, plus a
        # generated AppIcon.icns for earlier versions.
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "FocusGuard reads the active browser tab to detect distraction sites during focus sessions, and plays your focus music in Spotify or Apple Music."
        NSCalendarsFullAccessUsageDescription: "FocusGuard reads your calendar to auto-start focus sessions for events matching your keyword."
        NSCalendarsUsageDescription: "FocusGuard reads your calendar to auto-start focus sessions for events matching your keyword."
        # Sparkle auto-update. The appcast is published to GitHub Pages by the
        # release pipeline; SUPublicEDKey is the EdDSA public key whose private
        # half signs each release zip (see scripts/release.sh + docs/RELEASING.md).
        SUFeedURL: "https://anarzone.github.io/FocusGuard/appcast.xml"
        SUPublicEDKey: "c/Nu7tCDIlzOcOYwu1F71xW8b1fuq5bPcFiO1IBApYs="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard
        PRODUCT_NAME: FocusGuard
        # Public Client ID of FocusGuard's Spotify developer app; empty hides
        # Spotify search and sign-in.
        SPOTIFY_CLIENT_ID: 9c64a61db436412583b7a2285acf92e1
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without "all", the AppIcon.icns made for macOS 14-15 only has the
        # 16/32/128/256 px images, so Finder and Quick Look blur large sizes.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all

  # Sandboxed, as WidgetKit requires. It reads the snapshot the app writes
  # to the shared App Group folder and sends taps back through it. A
  # Team-ID prefixed group needs no provisioning profile on macOS, so the
  # free signing team builds and runs it.
  FocusGuardWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: FocusGuardWidgets
      - path: FocusGuardShared
    info:
      path: FocusGuardWidgets/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FocusGuardWidgets/FocusGuardWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [JVK43S5CGA.com.anar.focusguard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.widgets
        PRODUCT_NAME: FocusGuardWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  FocusGuardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FocusGuardTests
    dependencies:
      - target: FocusGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.tests
        GENERATE_INFOPLIST_FILE: YES
