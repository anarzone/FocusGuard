name: FocusGuard
options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  postGenCommand: scripts/add-known-regions.sh

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "JVK43S5CGA"     # Anar Haqverdiyev Personal Team
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES       # required for notarization
    CODE_SIGN_ENTITLEMENTS: FocusGuard/Resources/FocusGuard.entitlements
    SWIFT_STRICT_CONCURRENCY: minimal  # tighten to 'complete' once codebase is stable
    # String catalogs: English is the source, German and Azerbaijani are filled
    # in. README.md says how new strings get added; scripts/check-translations.py
    # (run by CI) fails on a missing translation.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  FocusGuard:
    type: application
    platform: macOS
    sources:
      - path: FocusGuard
      - path: FocusGuardShared
    dependencies:
      - package: Sparkle
      # Desktop widgets and the Control Center control (PlugIns/).
      - target: FocusGuardWidgets
      # Native-messaging host for the browser extension, in Contents/Helpers.
      - target: FocusGuardBrowserHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: FocusGuard/Resources/Info.plist
      properties:
        CFBundleName: FocusGuard
        CFBundleDevelopmentRegion: en
        # What macOS offers under Language & Region › Applications.
        CFBundleLocalizations: [en, de, az]
        # Spotify developer app for search (PKCE, no secret). Development mode:
        # only accounts added in the Spotify dashboard can sign in.
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        # Status in Slack and Discord (Pro). Slack app with PKCE (no secret);
        # Discord application for Rich Presence over the local app. Empty
        # hides that app's row.
        FGSlackClientID: $(SLACK_CLIENT_ID)
        FGDiscordApplicationID: $(DISCORD_APPLICATION_ID)
        # Signing in to GitHub (GitHub App, device flow) and Linear (OAuth with
        # PKCE) for tasks as goals; neither has a secret. Empty keeps only the
        # pasted token.
        FGGitHubClientID: $(GITHUB_CLIENT_ID)
        FGGitHubAppSlug: $(GITHUB_APP_SLUG)
        FGLinearClientID: $(LINEAR_CLIENT_ID)
        CFBundleDisplayName: FocusGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true                # menu bar app, no Dock icon
        # AppIcon.icon (Icon Composer): Assets.car for macOS 26, plus a
        # generated AppIcon.icns for earlier versions.
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: ""
        # focusguard:// links (FocusGuardURL), used by the paused-tab page
        # and Slack's sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: com.anar.focusguard
            CFBundleURLSchemes: [focusguard]
        NSAppleEventsUsageDescription: "FocusGuard reads the active browser tab to detect distraction sites during focus sessions, plays your focus music in Spotify or Apple Music, and offers your Things to-dos for today as session goals, ticking one off when you finish it."
        NSCalendarsFullAccessUsageDescription: "FocusGuard reads your calendar to start sessions from your events and show your next meeting, and adds your focus sessions as busy time if you turn that on. It never changes or deletes your own events."
        NSCalendarsUsageDescription: "FocusGuard reads your calendar to start sessions from your events and show your next meeting, and adds your focus sessions as busy time if you turn that on. It never changes or deletes your own events."
        NSRemindersFullAccessUsageDescription: "FocusGuard offers your open reminders as session goals, and ticks one off when you finish it in a session."
        NSRemindersUsageDescription: "FocusGuard offers your open reminders as session goals, and ticks one off when you finish it in a session."
        # Sparkle auto-update. The appcast is published to GitHub Pages by the
        # release pipeline; SUPublicEDKey is the EdDSA public key whose private
        # half signs each release zip (see scripts/release.sh + docs/RELEASING.md).
        SUFeedURL: "https://anarzone.github.io/FocusGuard/appcast.xml"
        SUPublicEDKey: "c/Nu7tCDIlzOcOYwu1F71xW8b1fuq5bPcFiO1IBApYs="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard
        PRODUCT_NAME: FocusGuard
        # Public Client ID of FocusGuard's Spotify developer app; empty hides
        # Spotify search and sign-in.
        SPOTIFY_CLIENT_ID: 9c64a61db436412583b7a2285acf92e1
        # Public Client ID of FocusGuard's Slack app (redirect
        # focusguard://slack-auth); empty hides Slack in Settings.
        SLACK_CLIENT_ID: "12167211366341.12482406261761"
        # Application ID of FocusGuard's Discord application; empty hides Discord.
        DISCORD_APPLICATION_ID: "1566805256136957962"
        # FocusGuard's GitHub App: public Client ID, and the slug in its
        # github.com/apps/ address. Empty keeps only the pasted token.
        GITHUB_CLIENT_ID: "Iv23liM1a28t1I8Roend"
        GITHUB_APP_SLUG: "focusguard-for-mac"
        # Public Client ID of FocusGuard's Linear app (redirect
        # http://127.0.0.1:47182/callback); empty keeps only the pasted key.
        LINEAR_CLIENT_ID: "696ca61ec7656993a2cf59722fcd3e58"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without "all", the AppIcon.icns made for macOS 14-15 only has the
        # 16/32/128/256 px images, so Finder and Quick Look blur large sizes.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all

  # Sandboxed, as WidgetKit requires. It reads the snapshot the app writes
  # to the shared App Group folder and sends taps back through it. A
  # Team-ID prefixed group needs no provisioning profile on macOS, so the
  # free signing team builds and runs it.
  FocusGuardWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: FocusGuardWidgets
      - path: FocusGuardShared
    info:
      path: FocusGuardWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, az]
        CFBundleDisplayName: FocusGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FocusGuardWidgets/FocusGuardWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [JVK43S5CGA.com.anar.focusguard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.widgets
        PRODUCT_NAME: FocusGuardWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Started by Chrome, Arc, Brave and Edge for the FocusGuard extension; relays
  # its messages to the running app over a local socket (FocusGuard/Extension).
  FocusGuardBrowserHelper:
    type: tool
    platform: macOS
    sources:
      - path: FocusGuardBrowserHelper
      - path: FocusGuard/Extension/NativeMessageFraming.swift
    settings:
      base:
        PRODUCT_NAME: FocusGuardBrowserHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.browserhelper
        # The app's entitlements (Apple Events, calendars) aren't for the helper.
        CODE_SIGN_ENTITLEMENTS: ""
        SKIP_INSTALL: YES

  FocusGuardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FocusGuardTests
    dependencies:
      - target: FocusGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.tests
        GENERATE_INFOPLIST_FILE: YES

  # Clicks the window with real mouse events (FocusGuardUITests scheme). The
  # app runs in UITestMode: an in-memory store, beside any real FocusGuard.
  FocusGuardUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FocusGuardUITests
    dependencies:
      - target: FocusGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.focusguard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FocusGuard

# Spelled out so `-scheme FocusGuard test` runs only the unit tests: the UI
# tests take over the mouse, so they run on their own scheme, in CI.
schemes:
  FocusGuard:
    build:
      targets:
        FocusGuard: all
        FocusGuardTests: [test]
    test:
      config: Debug
      # Tests assert English copy, whatever language the Mac runs in.
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
      targets:
        - FocusGuardTests
  FocusGuardUITests:
    build:
      targets:
        FocusGuard: all
        FocusGuardUITests: [test]
    test:
      config: Debug
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
      targets:
        - FocusGuardUITests
