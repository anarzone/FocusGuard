<!-- No site name in the title: title rules must never match this page. -->
<title>Paused · FocusGuard</title>
<!-- FocusGuard's paused-tab page. It ships inside the app and is opened as
     a file, so it works offline and loads nothing from the network. The app
     passes everything in the fragment (#id=…&host=…&state=…) and changes the
     fragment when the state changes; the buttons call the app through
     focusguard:// links.

     Fields: id, host, url, state (paused | queued | over | limit | hold), ends and
     start (Unix seconds), back (the app "Back to …" returns to), label (the
     session's name), minutes (a daily limit's length), tool (what a hold waits
     on), lang (the app's
     language when it isn't English). The "over" state can also carry name,
     auto (1 for an automatic name), end, focus, drift and other (minutes)
     and rate (the focus rate in percent). Every field but id can be missing;
     the page says less then.

     The page's words are in STRINGS below, not in the app's string catalog,
     and scripts/check-translations.py checks them too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    color-scheme: light dark;
    --top: #F8F7FF;
    --bottom: #EEECFD;
    --ink: #1D1D1F;
    --body: #3A3A42;
    --muted: #55555E;
    --accent: #6155F5;
    --accent-fill: #6155F5;
    --accent-soft: rgba(97, 85, 245, 0.16);
    --link: #4B3FD9;
    --shield-empty: #FFFFFF;
    --quiet: rgba(0, 0, 0, 0.06);
    --chip: rgba(255, 255, 255, 0.7);
    --chip-line: rgba(0, 0, 0, 0.08);
    --drift: #FF8D28;
    --other: rgba(0, 0, 0, 0.22);
    --pro: rgba(97, 85, 245, 0.14);
    --pro-ink: #4B3FD9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --top: #1B1B24;
      --bottom: #221F38;
      --ink: #F5F5F7;
      --body: rgba(255, 255, 255, 0.75);
      --muted: rgba(255, 255, 255, 0.6);
      --accent: #6D7CFF;
      --accent-fill: #5E5CE6;
      --accent-soft: rgba(109, 124, 255, 0.2);
      --link: #9AA3FF;
      --shield-empty: rgba(255, 255, 255, 0.08);
      --quiet: rgba(255, 255, 255, 0.1);
      --chip: rgba(255, 255, 255, 0.06);
      --chip-line: rgba(255, 255, 255, 0.12);
      --drift: #DC7620;
      --other: rgba(255, 255, 255, 0.34);
      --pro: rgba(109, 124, 255, 0.24);
      --pro-ink: #B9C0FF;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%) fixed;
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 72px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; }
  .shield { width: 76px; height: 76px; }
  .eyebrow { margin-top: 20px; font-size: 13px; font-weight: 600; color: var(--link); font-variant-numeric: tabular-nums; }
  h1 {
    font-size: 34px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 22px 0 0;
    overflow-wrap: anywhere;
  }
  .eyebrow + h1 { margin-top: 6px; }
  p { margin: 10px 0 0; font-size: 16px; color: var(--body); }
  .progress { margin-top: 22px; width: 320px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
  .bar > div { height: 6px; border-radius: 3px; background: var(--accent); width: 0; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 10px;
    border-radius: 12px;
    background: var(--chip);
    box-shadow: inset 0 0 0 0.5px var(--chip-line);
    font-size: 13px;
    max-width: 100%;
  }
  .chip svg { flex: 0 0 auto; }
  .chip .where { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-size: 13px; }
  .legend > div { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
  .actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 20px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 0;
  }
  .primary { background: var(--accent-fill); color: #FFFFFF; box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.45); }
  .secondary { background: var(--quiet); color: var(--ink); font-weight: 400; }
  .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  footer {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .pro {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--pro);
    color: var(--pro-ink);
  }
  [hidden] { display: none !important; }
</style>

  var language = STRINGS.en;

  function t(key, values) {
    return (language[key] || STRINGS.en[key]).replace(/\{(\w+)\}/g, function (all, name) {
      return values && values[name] !== undefined ? values[name] : all;
    });
  }

  function params() {
    var out = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (pair) {
      if (!pair) return;
      var i = pair.indexOf("=");
      var key = i < 0 ? pair : pair.slice(0, i);
      var value = i < 0 ? "" : pair.slice(i + 1);
      try { out[decodeURIComponent(key)] = decodeURIComponent(value.replace(/\+/g, " ")); } catch (e) {}
    });
    return out;

  /** Only web pages can be reopened, never a script or file link. */

    try {
      var url = new URL(value);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
    } catch (e) { return null; }
  }

    if (!href) return null;
    var url = new URL(href);
    var text = url.host.replace(/^www\./, "") + url.pathname.replace(/\/$/, "");
    return text.length > 60 ? text.slice(0, 59) + "…" : text;
  }

    return "focusguard://" + path + (id ? "?id=" + encodeURIComponent(id) : "");

  function $(id) { return document.getElementById(id); }

  function setButton(el, label, href) {
    if (!label || !href) { el.hidden = true; return; }

    el.textContent = label;
    el.setAttribute("href", href);
  }

  function setText(el, text) {
    el.hidden = !text;
    el.textContent = text || "";
  }

    return new Date(seconds * 1000).toLocaleTimeString(locales, { hour: "numeric", minute: "2-digit" });

  function render() {
    var p = params();

    var now = Date.now() / 1000;
    var left = ends ? ends - now : null;
    var address = shortAddress(p.url);

    var showProgress = false, showSaved = false, showLegend = false, complete = false;

        title = t(p.auto === "1" ? "overTitleAuto" : "overTitleNamed", { name: p.name });
        if (total) {
          body = t(p.rate ? "overBodyRate" : "overBodyTotal", { total: minutes(total), rate: p.rate, host: host });
        } else {
          body = t("overBodyPlain", { host: host });
        }
      } else {
        title = t("overTitle");
        body = t("overBody", { host: host });
      }
      showLegend = total > 0;
      if (showLegend) {
        legend("focused", "focused", focus);
        legend("drifted", "drifted", drift);
        legend("other", "other", other);
      }
      setButton($("primary"), t("takeBreak"), "focusguard://break?minutes=10");
      var reopen = safeWebURL(p.url);
      setButton($("secondary"), reopen ? t("reopen", { host: host }) : null, reopen);
      footer = t("overFooter");
    } else if (state === "hold") {
      var tool = p.tool || "";
      var target = safeWebURL(p.url);
      if (left !== null && left <= 0 && target) {
        // The hold is over: the site comes back in this tab by itself.
        title = t("holdTitle", { host: host, tool: tool });
        body = t("holdBodyNow", { host: host });
        location.replace(target);
      } else {
        var secondsLeft = Math.max(0, Math.ceil(left || 0));
        var clock = Math.floor(secondsLeft / 60) + ":" + String(secondsLeft % 60).padStart(2, "0");
        title = t("holdTitle", { host: host, tool: tool });
        body = t("holdBody", { left: clock, tool: tool });
      }
      showProgress = running !== null;
      if (showProgress) {
        $("bar").style.width = Math.round(Math.max(0, Math.min(1, running)) * 100) + "%";
        $("from").textContent = time(start);
        $("to").textContent = time(ends);
        $("progress").setAttribute("aria-label", t("holdTitle", { host: host, tool: tool }));
      }
      setButton($("primary"), back, app("back"));
      setButton($("secondary"), target ? t("holdOpenNow", { host: host }) : null, target);
      footer = t("holdFooter", { host: host, tool: tool });
    } else if (state === "limit") {
      title = t("limitTitle", { host: host });
      var limit = Number(p.minutes) || 0;
      body = limit ? t("limitBodyUsed", { limit: minutes(limit) }) : t("limitBody");
      setButton($("primary"), back, app("back"));
      setButton($("secondary"), null, null);
      footer = t("limitFooter");
    } else {
      title = t("pausedTitle", { host: host });
      if (minutesLeft !== null) {
        body = minutesLeft > 0
          ? t(label ? "pausedLeftNamed" : "pausedLeft", { label: label, left: minutes(minutesLeft) })
          : t(label ? "pausedEndingNamed" : "pausedEnding", { label: label });
      } else {
        body = t(label ? "pausedHereNamed" : "pausedHere", { label: label });
      }
      showProgress = running !== null;
      if (showProgress) {
        $("bar").style.width = Math.round(Math.max(0, Math.min(1, running)) * 100) + "%";
        $("from").textContent = time(start);
        $("to").textContent = t("ends", { time: time(ends) });
        $("progress").setAttribute("aria-label", t("progressLabel", { from: time(start), to: time(ends) }));
      }
      note = address ? t("note", { address: address }) : "";
      setButton($("primary"), back, app("back"));
      setButton($("secondary"), t("reopenAfter"), app("tab/reopen-later", p.id));
      footer = t("footerPro");
      pro = true;
    }

    // The shield fills as the session runs, like the one in the menu bar.
    fillShield(complete ? 1 : (state === "paused" || state === "queued") && running !== null ? running : 0);
    // An SVG element has no .hidden property; set the attribute itself.
    $("shield-check").toggleAttribute("hidden", !complete);
    $("shield").setAttribute("aria-label", complete ? t("sessionComplete") : "FocusGuard");

    setText($("eyebrow"), eyebrow);
    $("title").textContent = title;
    setText($("body"), body);
    $("progress").hidden = !showProgress;
    $("saved").hidden = !showSaved;
    $("saved-label").textContent = t("savedForLater");
    $("saved-where").textContent = address || "";
    $("legend").hidden = !showLegend;
    setText($("note"), note);
    $("footer-text").textContent = footer;
    $("footer-pro").hidden = !pro;
    document.title = t(state === "over" ? "titleOver" : state === "hold" ? "titleHold" : "titlePaused");

    clearTimeout(timer);
    if (ends && state !== "over") timer = setTimeout(render, 1000);
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
